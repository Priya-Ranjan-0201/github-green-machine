name: GitHub Green Machine

# ─────────────────────────────────────────────────────────────
# ⚡ GitHub Green Machine — Automated Repository Maintenance
# ─────────────────────────────────────────────────────────────
# Performs scheduled repository maintenance by recording a
# deterministic maintenance heartbeat timestamp.
# 
# • Real, forward-moving future maintenance commits.
# • Zero historical rewriting, zero backdating, zero force pushes.
# • Built-in GITHUB_TOKEN write authentication.
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # Runs 3 times daily:
    # • 03:30 UTC (09:00 AM IST) - Morning maintenance
    # • 10:30 UTC (04:00 PM IST) - Afternoon maintenance
    # • 16:30 UTC (10:00 PM IST) - Evening maintenance
    - cron: '30 3,10,16 * * *'
  workflow_dispatch:
    inputs:
      commit_count:
        description: 'Number of maintenance commits to create (1 to 3)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'

permissions:
  contents: write

concurrency:
  group: green-machine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    name: Repository Maintenance & Heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 👤 Configure Git Identity
        run: |
          # Use repository variables if configured; otherwise fall back to verified account defaults
          COMMIT_NAME="${{ vars.COMMIT_NAME || 'Priya-Ranjan-0201' }}"
          COMMIT_EMAIL="${{ vars.COMMIT_EMAIL || '186106336+Priya-Ranjan-0201@users.noreply.github.com' }}"

          echo "Configuring Git identity:"
          echo "  User:  $COMMIT_NAME"
          echo "  Email: $COMMIT_EMAIL"

          git config --local user.name "$COMMIT_NAME"
          git config --local user.email "$COMMIT_EMAIL"

      - name: ⏱️ Record Maintenance & Commit
        run: |
          mkdir -p .github/activity
          
          # Determine number of commits to produce (default 1 per scheduled slot)
          COUNT="${{ inputs.commit_count || '1' }}"
          echo "Processing $COUNT maintenance update(s)..."

          for i in $(seq 1 $COUNT); do
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            echo "Automated repository maintenance heartbeat: $TIMESTAMP [slot $i/$COUNT]" >> .github/activity/heartbeat.log
            
            # Lightweight log rotation: retain last 500 lines if file exceeds 1000 lines
            if [ $(wc -l < .github/activity/heartbeat.log) -gt 1000 ]; then
              tail -n 500 .github/activity/heartbeat.log > .github/activity/heartbeat.tmp
              mv .github/activity/heartbeat.tmp .github/activity/heartbeat.log
            fi

            git add .github/activity/heartbeat.log

            if git diff --staged --quiet; then
              echo "No staged changes detected. Skipping."
            else
              git commit -m "chore: automated repository maintenance"
              echo "Created commit $i at $TIMESTAMP"
            fi

            # Short delay between consecutive commits if generating multiple
            if [ "$i" -lt "$COUNT" ]; then
              sleep 2
            fi
          done

      - name: 🚀 Pull Rebase and Push
        run: |
          # Pull latest changes safely with rebase to prevent race conditions
          git pull --rebase origin main || true

          # Push to the default branch using the hourly GITHUB_TOKEN
          git push origin main
